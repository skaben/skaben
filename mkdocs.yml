site_name: SKABEN Docs
site_description: SKABEN operational documentation
repo_name: skaben/skaben

docs_dir: docs

theme:
  name: material
  language: en

plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: en
          name: English
          build: true
          default: true
        - locale: ru
          name: Русский
          build: true
          nav_translations:
            Home: Главная
            Deployment: Развертывание
            Description: Описание
            Operations: Эксплуатация
            Overview: Оглавление
            Alert statuses: Статусы тревоги
            Operator guide: Руководство оператора
            Devices: Устройства
            Light array: Массив освещения
            Powerbox: Щиток
            Scale: Шкала
            Lock: Замок
            Terminal: Терминал
            Development: Разработка
            Addressing: Адресация
            Transport: Транспорт

nav:
  - Home: index.md
  - Deployment: deployment.md
  - Description: description.md
  - Operations:
    - Overview: operating/index.md
    - Alert statuses: operating/alert_status.md
    - Operator guide: operating/operator_guide.md
    - Devices: operating/client_devices.md
    - Light array: operating/light_array.md
    - Powerbox: operating/powerbox.md
    - Scale: operating/scale.md
    - Lock: operating/lock.md
    - Terminal: operating/terminal.md
  - Development:
    - Overview: development/index.md
    - Addressing: development/addressing.md
    - Transport: development/transport.md

use_directory_urls: true
